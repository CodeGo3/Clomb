<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clomb AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .logo {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle { color: #a0c0e0; font-size: 18px; }

        .search-box {
            display: flex;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 50px;
            background: transparent;
            color: white;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .search-box button {
            padding: 15px 30px;
            border: none;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            color: #0a0e27;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,215,0,0.5);
        }
        .search-box button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .ai-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
        }
        .ai-card:hover {
            border-color: #ffd700;
        }
        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .ai-icon { font-size: 24px; }
        .ai-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        .ai-status {
            margin-left: auto;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 10px;
        }
        .ai-status.loading {
            background: #ffaa00;
            color: #0a0e27;
        }
        .ai-status.done {
            background: #00ff88;
            color: #0a0e27;
        }
        .ai-status.error {
            background: #ff4757;
            color: white;
        }
        .ai-content {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
        }
        .ai-content.loading {
            color: #a0c0e0;
            font-style: italic;
        }

        .info {
            text-align: center;
            margin-top: 30px;
            color: #a0c0e0;
            font-size: 13px;
        }

        .ai-content::-webkit-scrollbar { width: 8px; }
        .ai-content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .ai-content::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">Clomb AI</div>
        <div class="subtitle">Объединение искусственных интеллектов</div>
    </div>

    <div class="search-box">
        <input type="text" id="query" placeholder="Задай вопрос обоим ИИ сразу..." autocomplete="off">
        <button id="sendBtn" onclick="askAll()">Спросить</button>
    </div>

    <div class="results">
        <div class="ai-card" id="card-groq">
            <div class="ai-header">
                <span class="ai-icon">⚡</span>
                <span class="ai-name">Groq (GPT-OSS 120B)</span>
                <span class="ai-status" id="status-groq">ожидание</span>
            </div>
            <div class="ai-content" id="content-groq">Задай вопрос, чтобы получить ответ.</div>
        </div>

        <div class="ai-card" id="card-pollinations">
            <div class="ai-header">
                <span class="ai-icon">🌸</span>
                <span class="ai-name">Pollinations (OpenAI)</span>
                <span class="ai-status" id="status-pollinations">ожидание</span>
            </div>
            <div class="ai-content" id="content-pollinations">Задай вопрос, чтобы получить ответ.</div>
        </div>
    </div>

    <div class="info">
        Clomb AI © 2026 · Все ответы от разных ИИ в одном месте
    </div>

</div>

<script>
    // ===== ВСТАВЬ СВОЙ КЛЮЧ GROQ СЮДА =====
    const GROQ_API_KEY = "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";

    // ===== СТАТУС =====
    function setStatus(ai, status, text) {
        const el = document.getElementById('status-' + ai);
        el.className = 'ai-status ' + status;
        el.textContent = text;
    }

    function setContent(ai, text, loading = false) {
        const el = document.getElementById('content-' + ai);
        el.textContent = text;
        el.className = 'ai-content' + (loading ? ' loading' : '');
    }

    // ===== GROQ =====
    async function askGroq(question) {
        if (GROQ_API_KEY.includes("ТВОЙ")) {
            return "⚡ Groq: Вставь API-ключ в код (строка GROQ_API_KEY). Получить: console.groq.com";
        }
        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GROQ_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'openai/gpt-oss-120b',  // <-- ИСПРАВЛЕННАЯ МОДЕЛЬ
                    messages: [
                        { role: 'system', content: 'Ты Clomb AI, дружелюбный и умный помощник. Отвечай кратко и по делу на русском языке.' },
                        { role: 'user', content: question }
                    ],
                    temperature: 0.7,
                    max_tokens: 800
                })
            });
            const data = await response.json();
            if (data.choices && data.choices[0]) {
                return data.choices[0].message.content;
            } else if (data.error) {
                return "Ошибка Groq: " + data.error.message;
            }
            return "Неизвестный ответ: " + JSON.stringify(data);
        } catch (e) {
            return "Ошибка сети: " + e.message;
        }
    }

    // ===== POLLINATIONS (без ключа!) =====
    async function askPollinations(question) {
        try {
            const response = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: 'Ты Clomb AI, дружелюбный помощник. Отвечай на русском.' },
                        { role: 'user', content: question }
                    ],
                    model: 'openai'
                })
            });
            const text = await response.text();
            return text;
        } catch (e) {
            return "Ошибка сети: " + e.message;
        }
    }

    // ===== ГЛАВНАЯ ФУНКЦИЯ =====
    async function askAll() {
        const question = document.getElementById('query').value.trim();
        if (!question) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = 'Думают...';

        setStatus('groq', 'loading', 'думает...');
        setContent('groq', 'Загрузка...', true);
        setStatus('pollinations', 'loading', 'думает...');
        setContent('pollinations', 'Загрузка...', true);

        const [groqResult, pollResult] = await Promise.all([
            askGroq(question),
            askPollinations(question)
        ]);

        setStatus('groq', 'done', 'готово');
        setContent('groq', groqResult);
        setStatus('pollinations', 'done', 'готово');
        setContent('pollinations', pollResult);

        btn.disabled = false;
        btn.textContent = 'Спросить';
    }

    document.getElementById('query').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') askAll();
    });

    document.getElementById('query').focus();
</script>

</body>
</html>
